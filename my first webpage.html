<!DOCTYPE html>
<!-- This line tells the browser that this document uses HTML5. -->

<html lang="en">
<!-- This opening html tag starts the webpage and specifies that the page is written in English. -->

<head>
<!-- This opening head tag contains information about the webpage that is not displayed directly on the page. -->

    <meta charset="UTF-8">
    <!-- This line sets the character encoding to UTF-8 so the browser can correctly display letters, numbers, and symbols. -->

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- This line makes the webpage responsive so it displays properly on different screen sizes. -->

    <title>My First Web Page</title>
    <!-- This line sets the title that appears in the browser tab. -->

</head>
<!-- This closing head tag marks the end of the webpage's head section. -->

<body>
<!-- This opening body tag begins the visible content of the webpage. -->

    <header>
    <!-- This opening header tag identifies the introductory section of the webpage. -->

        <h1>My First Web Page</h1>
        <!-- This line displays the main heading of the webpage. -->

    </header>
    <!-- This closing header tag marks the end of the header section. -->

    <main>
    <!-- This opening main tag identifies the primary content of the webpage. -->

        <h2>Student Information</h2>
        <!-- This line displays a secondary heading for the student information. -->

        <p><strong>Username:</strong> jjh96</p>
        <!-- This line displays the student's username. -->

        <p><strong>Course:</strong> Intro to Website Development</p>
        <!-- This line displays the name of the course. -->

        <p><strong>Course Number and Section:</strong> IS117003</p>
        <!-- This line displays the course number and section. -->

    </main>
    <!-- This closing main tag marks the end of the primary webpage content. -->

    <footer>
    <!-- This opening footer tag begins the footer section at the bottom of the webpage. -->

        <p>&copy; 2026 Jetmir Hernandez | Due Date: 10/6</p>
        <!-- This line displays the copyright symbol, the student's name, and the assignment due date. -->

    </footer>
    <!-- This closing footer tag marks the end of the footer section. -->

</body>
<!-- This closing body tag marks the end of all visible webpage content. -->

</html>
<!-- This closing html tag marks the end of the HTML document. -->
